---
- name: Build and Run Backend on Remote Hosts
  hosts: backend_servers
  become: yes


  vars:
    dockerhub_username: "hebaali4"
    backend_image: "hebaali4/backend-image"
    container_name: "backend"

  tasks:
 # Step 1: Install prerequisites and Docker
    - name: Install required system packages
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - software-properties-common
        - gnupg-agent

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: Install Docker CE
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to Docker group
      user:
        name: ubuntu   # Replace with your desired username
        groups: docker
        append: yes    
        
    - name: Ensure backend container is absent
      docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: yes

    - name: Remove existing backend image
      shell: docker rmi {{ backend_image }} || true
      ignore_errors: yes

    - name: Pull Backend Docker image
      docker_image:
        name: "{{ backend_image }}"
        source: pull

    - name: Stop any process using port {{ app_port }}
      shell: |
        lsof -i :{{ app_port }} -t | xargs -r sudo kill -9
      ignore_errors: yes

    - name: Run Backend container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ backend_image }}"
        ports:
          - "{{ app_port }}:{{ app_port }}"
        restart_policy: always
        state: started
        env:
          PORT: "{{ app_port }}"
          DB_USER_NAME: "{{ DB_USER_NAME }}"
          DB_PASSWORD: "{{ DB_PASSWORD }}"
          DB_NAME: "{{ DB_NAME }}"
          DB_URI: "{{ DB_URI }}"
          HASHING_COST: "10"
          ENCRYPTION_KEY: "{{ ENCRYPTION_KEY }}"

    - name: Verify container is running
      shell: docker ps --filter "name={{ container_name }}"
      register: container_status
      changed_when: false

    - name: Show container status
      debug:
        var: container_status.stdout_lines

    - name: Check container logs for errors
      shell: docker logs {{ container_name }}
      register: container_logs
      changed_when: false
      ignore_errors: yes

    - name: Display container logs
      debug:
        var: container_logs.stdout_lines
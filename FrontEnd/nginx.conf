user nginx;  # Specifies the user under which the NGINX worker processes will run.

worker_processes auto;  # Automatically sets the number of worker processes based on available CPU cores.

error_log /var/log/nginx/error.log warn;  # Specifies the error log file location and logging level (warn level logs warnings and more severe errors).

pid /var/run/nginx.pid;  # Specifies the PID (Process ID) file location.

events {
    worker_connections 1024;  # Specifies the maximum number of simultaneous connections each worker process can handle. 
}

http {
    include /etc/nginx/mime.types;  # Include MIME types from the file to determine the file types for different content.
    default_type application/octet-stream;  # Default MIME type for files when it's not defined.

    # Define the log format for access logs (detailed logs of every request).
    log_format main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'upstream_response_time $upstream_response_time '
                     'request_time $request_time';

    access_log /var/log/nginx/access.log main;  # Specify the location of the access log and use the defined format.

    sendfile on;  # Enables efficient file transfers. It allows NGINX to send files directly to the network without the need for buffering.

    keepalive_timeout 65;  # Specifies the maximum time in seconds that a connection will be kept alive.

    # Define the backend servers for the API.
    upstream backend {
        # Here you would list multiple backend servers for load balancing.
        # Example:
        # server 16.171.149.198:8000;
        # server 13.53.206.84:8000;
        
        server 192.168.75.128:8000;  # This is an example backend server IP address.
        server 192.168.75.128:8001;  # Another backend server for redundancy.
    }

    server {
        listen 80;  # Specifies that this server block listens on port 80 (HTTP).

        # Root directory for serving React files (static files).
        root /usr/share/nginx/html;
        index index.html;  # Default file to serve when a directory is requested.

     
        
        # Serve static files (like images, JS, and CSS files) from the static directory.
        location /static/ {
            try_files $uri $uri/ =404;  # If the requested file is not found, return a 404 error.
        }

        # Proxy requests to the backend servers for API calls.
        location /api/ {
            proxy_pass http://backend;  # Pass the API request to the 'backend' upstream group.
            proxy_set_header Host $host;  # Set the 'Host' header for the backend.
            proxy_set_header X-Real-IP $remote_addr;  # Set the 'X-Real-IP' header to pass the real client IP.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Set the 'X-Forwarded-For' header to maintain the chain of proxies.
            proxy_set_header X-Forwarded-Proto $scheme;  # Pass the original protocol (HTTP or HTTPS) to the backend.

            proxy_intercept_errors on;  # Enable error interception for API responses.

            proxy_connect_timeout 5s;  # Timeout for establishing a connection to the upstream server.
            proxy_read_timeout 10s;  # Timeout for reading data from the upstream server.
# 
            # Map API error codes to custom error pages.
            error_page 400 /error-pages/400.html;
            error_page 401 /error-pages/401.html;
            error_page 403 /error-pages/403.html;
            error_page 404 /error-pages/404.html;
            error_page 500 /error-pages/500.html;
            error_page 502 /error-pages/502.html;
            error_page 503 /error-pages/503.html;
            error_page 504 /error-pages/504.html;

            rewrite ^/api/(.*) /$1 break;  # Strip out the '/api' part of the URL and pass the rest to the backend.
        }

        # Serve error pages from the /usr/share/nginx/html/error-pages/ directory.
        location /error-pages/ {
            alias /usr/share/nginx/html/error-pages/;  # Map this location to the directory that contains custom error pages.
            try_files $uri =404;  # If the requested error page is not found, return a 404 error.
        }

        # Serve React for all other routes (fallback to index.html for routing).
        location / {
            try_files $uri $uri/ /index.html;  # Try to serve the requested file, else fall back to index.html (for client-side routing).
        }

        # Cache static files (like JS, CSS, images, etc.) for a long time.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 1y;  # Cache static files for 1 year.
            add_header Cache-Control "public, max-age=31536000";  # Add cache headers to the response.
        }
    }
}

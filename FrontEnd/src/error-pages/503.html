<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Bad Request</title>
    <style>
        :root {
            --primary: #D4AF37;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .error-container {
            max-width: 600px;
            padding: 2rem;
        }
        .error-img {
            width: 300px;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #ba9a31;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="https://res-console.cloudinary.com/dnszuaxw1/media_explorer_thumbnails/c54ba5d8728df91b7ff362a634165d81/detailed" alt="400 Error" class="error-img">
        <h1>503 - Service Unavailable</h1>
        <p>We're down for maintenance. Please check back soon!</p>        <a href="/" class="btn">Go to Homepage</a>
    </div>
</body>
</html>
